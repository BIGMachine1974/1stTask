[project]
name = "agent-team"
version = "0.1.0"
description = "Multi-agent team system with a Managing Agent orchestrator"
requires-python = ">=3.11"
dependencies = [
    "claude-code-sdk>=0.1.48",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
voyage = [
    "voyageai>=0.3.0",
]
pdf = [
    "pymupdf>=1.24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
