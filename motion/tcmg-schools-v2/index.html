<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../common/tcmg-motion.js"></script>
<script>
// TCMG "The catchment trap". Timings follow vo.mp3 (Greg - Radio Host, take 1).
window.DUR=39.5;
window.CAPS=[[0.05,2.85,"Being in the catchment doesn't mean|your kid *gets a seat.*"],
[3.15,4.95,'Ottawa has *four school boards*,'],
[4.95,7.85,'and every address maps to|a *different school* on each one.'],
[8.18,10.85,'In the south end, the map|is only *half the story.*'],
[11.2,15.75,'Vimy Ridge Public School in Findlay Creek|was built for *674 students.*'],
[15.98,19.5,'By 2022, it had *17 portables* in the yard.'],
[19.8,24.15,'Riverside South went without a public|high school until *September 2025.*'],
[24.44,28.35,'So before you fall for a kitchen,|*call the board* and ask two questions.'],
[28.53,30.7,'Which school is this address *zoned for?*'],
[30.79,33.85,'And is that school *over capacity* right now?'],
[34.0,36.0,'Pick the school. *Then the house.*'],
[36.23,99,'More at *yourhomeinottawa.ca*',0,1]];
window.END={t0:36.23,typeAt:36.55,typeDur:1.5,phoneAt:38.3,tag:['Pick the school.','Then the house.']};

// ---------- scene pieces ----------
// the hero: one school building, reused for Vimy Ridge and Riverside South
function school(cx,base,w,h,{rise=1,dashed=false,alpha=1}={}){
  x.save();x.globalAlpha*=alpha;
  if(dashed){x.strokeStyle=C.mute;x.lineWidth=4;x.setLineDash([16,12]);rr(cx-w/2,base-h,w,h);x.stroke();
    text('?',cx,base-h/2+40,{size:120,weight:800,fam:HEAD,color:C.mute});x.restore();return;}
  const hh=h*clamp(rise,0,1.12);shadow(cx,base+10,w*1.05,.12*clamp(rise));
  x.fillStyle=C.white;x.strokeStyle=C.ink;x.lineWidth=4;rr(cx-w/2,base-hh,w,hh);x.fill();x.stroke();
  if(rise>.75){const a=clamp((rise-.75)/.25);x.globalAlpha*=a;
    x.fillStyle=C.brass;x.fillRect(cx-w/2+2,base-hh+2,w-4,18);
    x.fillStyle=C.paper;for(let r=0;r<2;r++)for(let k=0;k<6;k++)if(!(r===1&&(k===2||k===3))){const ww=(w-68)/6-24;rr(cx-w/2+34+k*((w-68)/6)+12,base-hh+52+r*(hh-110)/1.6,ww,40);x.fill();x.strokeStyle=C.line;x.lineWidth=2;x.stroke();}
    x.fillStyle=C.moss;rr(cx-34,base-90,68,90);x.fill();
    x.strokeStyle=C.ink;x.lineWidth=5;x.beginPath();x.moveTo(cx+w/2-50,base-hh);x.lineTo(cx+w/2-50,base-hh-90);x.stroke();
    const wv=Math.sin(x._t*3)*4;x.fillStyle=C.brassD;x.beginPath();x.moveTo(cx+w/2-50,base-hh-90);x.lineTo(cx+w/2+10,base-hh-78+wv);x.lineTo(cx+w/2-50,base-hh-62);x.fill();}
  x.restore();}
function portable(){x.fillStyle=C.paper;x.strokeStyle=C.ink;x.lineWidth=3;rr(-40,-22,80,44);x.fill();x.stroke();x.fillStyle=C.ink;x.fillRect(-26,-9,16,12);x.fillRect(10,-9,16,12);}
function boardTile(l1,l2,lit){x.fillStyle=lit?C.brass:C.white;x.strokeStyle=lit?C.brass:C.line;x.lineWidth=3;rr(-200,-90,400,180);x.fill();x.stroke();
  text(l1,0,-8,{size:40,weight:800,fam:HEAD,color:C.ink});text(l2,0,42,{size:28,weight:700,color:lit?C.ink:C.brassD,ls:4});}

window.scenes=function(t){
  // A: hook (0 - 3.0)
  if(t<3.1){const a=1-smooth((t-2.8)/.3);const l1=spring(t-0.15,LAND),l2=spring(t-1.15,LAND),l3=spring(t-2.1,LAND);
    landLine('In the catchment',640,0.15,t,{size:96,a});landLine("doesn't mean",760,1.15,t,{size:96,color:C.mute,a});
    landLine('*a seat.*',960,2.1,t,{size:200,a,from:1.6});
    finePrint([BROKER],a*clamp(t/.4));}
  // B: four boards, one address (3.15 - 8.1)
  if(t>3.05&&t<8.2){const a=fadeWin(t,3.05,8.05,.3);
    const T=[[300,520,'ENGLISH','PUBLIC'],[780,520,'ENGLISH','CATHOLIC'],[300,760,'FRENCH','PUBLIC'],[780,760,'FRENCH','CATHOLIC']];
    head('Four school *boards*',3.2,t,a);
    const hp=spring(t-5.35,LAND),HX=540,HY=1150;
    if(t>5.3)T.forEach(([X,Y],i)=>{const p=smooth((t-(6.0+i*.25))/.45);if(p<=0)return;const ex=lerp(HX,X,p),ey=lerp(HY-70,Y+90,p);
        x.save();x.globalAlpha=a;x.strokeStyle=C.brassD;x.lineWidth=4;x.setLineDash([12,10]);x.beginPath();x.moveTo(HX,HY-70);x.lineTo(ex,ey);x.stroke();x.restore();});
    T.forEach(([X,Y,l1,l2],i)=>{const s=spring(t-(3.75+i*.2),LAND);const lit=t>6.0+i*.25+.45;
      withT(X,Y+(1-clamp(s))*40,lerp(.7,1,clamp(s,0,1.15)),()=>boardTile(l1,l2,lit),a*clamp(s*1.5));});
    if(t>5.3){withT(HX,HY-(1-clamp(hp))*200,lerp(.6,1,clamp(hp,0,1.2)),house,a*clamp(hp*2));
      text('ONE ADDRESS',HX,HY+100,{size:28,weight:700,color:C.ink,ls:5,alpha:a*clamp((t-5.6)/.3)});
      T.forEach(([X,Y],i)=>{if(t<6.45+i*.25)return;const d=spring(t-(6.45+i*.25),SNAP);withT(X,Y+90,clamp(d,0,1.2),()=>{x.fillStyle=C.ink;x.beginPath();x.arc(0,0,13,0,7);x.fill();},a);});
      runs([['4 boards = ',C.ink],['4 different schools',C.brassD]],540,1320,{size:44,weight:800,fam:BODY,alpha:a*clamp((t-6.9)/.3)});}
    finePrint(['Boards: OCDSB, OCSB, CEPEO, CECCE',BROKER],a);}
  // C: half the story (8.18 - 11.0)
  if(t>8.1&&t<11.1){const a=fadeWin(t,8.1,10.95,.25);const l=spring(t-8.2,LAND);
    landLine('The map is only',820,8.2,t,{size:96,a});landLine('*half* the story.',935,8.4,t,{size:96,a});
    finePrint([BROKER],a);}
  // D: Vimy Ridge fills to 674, overflows into 17 portables (11.2 - 19.6)
  if(t>11.1&&t<19.75){const a=fadeWin(t,11.1,19.6,.3);const rise=spring(t-11.25,PANEL);
    head('Vimy Ridge *Public School*',11.3,t,a,{size:72});kicker('FINDLAY CREEK',11.4,t,a);
    school(540,900,560,300,{rise,alpha:a});
    const fillP=smooth((t-13.4)/1.5);const cnt=Math.round(674*fillP);const cl=spring(t-13.4,SNAP);
    withT(540,535,lerp(.8,1,clamp(cl)),()=>{x.fillStyle=C.parch;rr(-210,-92,420,148);x.fill();
      text(cnt.toLocaleString('en-CA'),0,0,{size:108,weight:800,fam:HEAD,color:C.brassD});
      text('STUDENT PLACES BUILT',0,40,{size:26,weight:700,color:C.ink,ls:4});},a*clamp(cl*1.5)*(1-smooth((t-15.85)/.3)));
    const BX0=150,BX1=930,BY=1175,CAP=.68;const over=smooth((t-16.0)/2.4);const f=CAP*fillP+(.98-CAP)*over;
    x.save();x.globalAlpha=a*clamp((t-13.2)/.3);x.fillStyle=C.paper;x.strokeStyle=C.line;x.lineWidth=2;rr(BX0,BY,BX1-BX0,36);x.fill();x.stroke();
    x.save();rr(BX0,BY,BX1-BX0,36);x.clip();x.fillStyle=C.moss;x.fillRect(BX0,BY,(BX1-BX0)*Math.min(f,CAP),36);
    if(f>CAP){const ox=BX0+(BX1-BX0)*CAP,ow=(BX1-BX0)*(f-CAP);x.fillStyle=C.brass;x.fillRect(ox,BY,ow,36);
      x.strokeStyle=C.ink;x.lineWidth=3;x.globalAlpha*=.35;for(let s=ox-40;s<ox+ow;s+=18){x.beginPath();x.moveTo(s,BY+36);x.lineTo(s+36,BY);x.stroke();}}
    x.restore();const cx=BX0+(BX1-BX0)*CAP;x.strokeStyle=C.ink;x.lineWidth=4;x.beginPath();x.moveTo(cx,BY-20);x.lineTo(cx,BY+56);x.stroke();
    text('CAPACITY 674',cx,BY-34,{size:24,weight:800,color:C.ink,ls:3});
    if(t>16.1){const s=spring(t-16.2,SNAP);text('OVER CAPACITY',lerp(cx,BX1,.5)+20,BY+92,{size:26,weight:800,color:C.brassD,ls:4,alpha:clamp(s)});}
    x.restore();
    for(let i=0;i<17;i++){const r=i<9?0:1,k=r?i-9:i;const px=r?172+k*105:118+k*105,py=r?1060:990;
      const s=spring(t-(17.25+i*.07),LAND);if(s<=0)continue;withT(px,py-(1-clamp(s))*60,clamp(s,0,1.2),portable,a);}
    if(t>18.0){const s=spring(t-18.0,LAND);withT(540,640,lerp(1.5,1,clamp(s,0,1.2)),()=>{x.fillStyle=C.brass;rr(-260,-62,520,110);x.fill();
      text('17 PORTABLES',0,18,{size:58,weight:800,fam:HEAD,color:C.ink});},a*clamp(s*2),-.035);}
    finePrint(['Capacity: OCDSB. Portables: Ottawa Citizen, 2022.',BROKER],a);}
  // E: Riverside South, the outline becomes a school (19.8 - 24.3)
  if(t>19.7&&t<24.35){const a=fadeWin(t,19.7,24.2,.25);
    head('Riverside *South*',19.85,t,a);
    const built=t>22.6;const rise=spring(t-22.65,LAND);
    if(!built)school(540,1010,600,380,{dashed:true,alpha:a*clamp((t-19.9)/.3)});else school(540,1010,600,380,{rise,alpha:a});
    if(!built)text('NO PUBLIC HIGH SCHOOL',540,1110,{size:32,weight:800,color:C.mute,ls:4,alpha:a*clamp((t-20.4)/.3)});
    else{text('RIVERSIDE SOUTH SECONDARY',540,1110,{size:32,weight:800,color:C.brassD,ls:4,alpha:a*clamp((t-22.8)/.3)});
      const st=spring(t-23.2,LAND);if(t>23.2)withT(510,530,lerp(1.7,1,clamp(st,0,1.2)),()=>{x.fillStyle=C.brass;rr(-240,-50,480,100);x.fill();
        text('OPENED SEPT 2025',0,16,{size:44,weight:800,fam:HEAD,color:C.ink,ls:2});},a*clamp(st*2),-.06);}
    finePrint(['Source: Riverside South Secondary School (OCDSB)',BROKER],a);}
  // F: two questions (24.44 - 33.95)
  if(t>24.35&&t<34.0){const a=fadeWin(t,24.35,33.9,.3);const l=spring(t-24.45,LAND),up=smooth((t-26.25)/.6);
    head('Before you fall',24.45,t,a);head('for a *kitchen*...',24.65,t,a,{y:460});
    if(t>26.4)kicker('CALL THE BOARD. ASK TWO QUESTIONS.',26.5,t,a,540);
    const Q=[[28.53,30.3,800,'01','Which school is this','address zoned for?'],[30.79,33.2,1060,'02','Is that school over','capacity right now?']];
    Q.forEach(([s0,ck0,Y,n,l1,l2])=>{const s=spring(t-s0,PANEL);if(s<=0)return;withT(540+(1-clamp(s))*120,Y,1,()=>{
      x.fillStyle=C.white;x.strokeStyle=C.line;x.lineWidth=3;rr(-440,-105,880,210);x.fill();x.stroke();
      text(n,-370,22,{size:72,weight:800,fam:HEAD,color:C.brassD,align:'left'});
      text(l1,-230,-10,{size:44,weight:700,color:C.ink,align:'left'});text(l2,-230,46,{size:44,weight:700,color:C.ink,align:'left'});
      const ck=spring(t-ck0,LAND);if(t>ck0)withT(372,-58,clamp(ck,0,1.2),()=>{x.fillStyle=C.moss;x.beginPath();x.arc(0,0,30,0,7);x.fill();
        x.strokeStyle=C.white;x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(-12,1);x.lineTo(-3,11);x.lineTo(13,-9);x.stroke();});
    },a*clamp(s*1.4));});
    finePrint(['Boundaries change. Confirm with the school board before you firm up.',BROKER],a);}
  // G: the line (34.0 - 36.1)
  if(t>33.95&&t<36.2){const a=fadeWin(t,33.95,36.05,.2);const l1=spring(t-34.0,LAND),l2=spring(t-35.06,LAND);
    const shake=t>35.06&&t<35.36?Math.sin((t-35.06)*90)*8*(1-(t-35.06)/0.3):0;
    landLine('*Pick the school.*',780,34.0,t,{size:112,a,from:1.5});landLine('Then the house.',930,35.06,t,{size:112,a,from:1.5});
    finePrint([BROKER],a);}
};
