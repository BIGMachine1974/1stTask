<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"MR";font-weight:400 800;src:url("assets/Manrope.woff2") format("woff2")}
@font-face{font-family:"MS";font-weight:800;src:url("assets/Mansfield-Extra-Bold.ttf")}
html,body{margin:0;background:#e7e3d8}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// TCMG cut-paper style test: an Ottawa street assembles out of torn paper, animated on twos.
// Contract with render.js: window.ready (promise), window.DUR (s), window.seek(t) draws the frame at t.
const W=1080,H=1920,cv=document.getElementById('c'),x=cv.getContext('2d');
const C={carbon:'#121411',ink:'#171915',parch:'#f1efe8',paper:'#e7e3d8',white:'#fffdf8',
  brass:'#c2a56a',brassL:'#d8c08f',brassD:'#725b2f',moss:'#59644d',mossL:'#7d8770',mute:'#5a5b54',brick:'#a8664a',slate:'#4d5560'};
window.DUR=6.5;

// ---------- paper helpers ----------
function rng(seed){let s=seed>>>0||1;return()=>((s=Math.imul(s^s>>>15,s|1),s^=s+Math.imul(s^s>>>7,s|61),((s^s>>>14)>>>0)/4294967296));}
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
function spring(dt,w=16,z=.5){if(dt<=0)return 0;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z*w/wd*Math.sin(wd*dt));}
// torn edge: walk a polygon and roughen every edge with small seeded bumps; the seed changes every 2 frames (the "boil")
function torn(pts,seed,amp=3,step=14){const r=rng(seed),out=[];
  for(let i=0;i<pts.length;i++){const[a,b]=[pts[i],pts[(i+1)%pts.length]];const L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.round(L/step));
    const nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;
    for(let k=0;k<n;k++){const p=k/n,j=(r()-.5)*2*amp;out.push([a[0]+(b[0]-a[0])*p+nx*j,a[1]+(b[1]-a[1])*p+ny*j]);}}
  return out;}
let BOIL=0; // set per frame
function piece(pts,fill,id,{amp=3,shadow=true,grain=true}={}){const p=torn(pts,id*977+BOIL*13,amp);
  x.save();x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();
  if(shadow){x.shadowColor='rgba(23,25,21,.28)';x.shadowBlur=14;x.shadowOffsetX=5;x.shadowOffsetY=8;}
  x.fillStyle=fill;x.fill();x.shadowColor='transparent';
  if(grain){x.clip();x.globalAlpha=.10;x.drawImage(GRAIN,0,0);} x.restore();}
const rect=(X,Y,w,h)=>[[X,Y],[X+w,Y],[X+w,Y+h],[X,Y+h]];

// paper fibre grain, drawn once
const GRAIN=document.createElement('canvas');GRAIN.width=W;GRAIN.height=H;
{const g=GRAIN.getContext('2d'),r=rng(7);for(let i=0;i<26000;i++){g.fillStyle=r()<.5?'#000':'#fff';g.globalAlpha=r()*.6;
  g.fillRect(r()*W,r()*H,1+r()*2.5,1+r()*1.2);}}

// ---------- the pieces ----------
function house(cx,base,w,h,wall,roof,door,id,{chimney=false}={}){
  const X=cx-w/2,Y=base-h;
  if(chimney)piece(rect(X+w*.62,Y-h*.42,w*.12,h*.3),C.brick,id+5,{amp:2});
  piece(rect(X,Y,w,h),wall,id,{amp:2.5});
  piece([[X-24,Y+6],[cx,Y-h*.5],[X+w+24,Y+6]],roof,id+1,{amp:3});
  piece(rect(cx-w*.11,base-h*.46,w*.22,h*.46),door,id+2,{amp:2});
  const ww=w*.2;
  piece(rect(X+w*.12,Y+h*.18,ww,ww),C.brassL,id+3,{amp:1.5,shadow:false});
  piece(rect(X+w*.68,Y+h*.18,ww,ww),C.brassL,id+4,{amp:1.5,shadow:false});}
function tree(cx,base,s,id){piece(rect(cx-9*s,base-80*s,18*s,80*s),C.brassD,id,{amp:1.5});
  piece([[cx,base-260*s],[cx+85*s,base-70*s],[cx-85*s,base-70*s]],C.moss,id+1,{amp:4});
  piece([[cx,base-320*s],[cx+65*s,base-170*s],[cx-65*s,base-170*s]],C.mossL,id+2,{amp:4});}
function sold(cx,base,id){piece(rect(cx-6,base-190,12,190),C.brassD,id,{amp:1.5});
  piece(rect(cx-105,base-270,210,90),C.white,id+1,{amp:2.5});
  x.save();x.font='800 54px MS';x.fillStyle=C.ink;x.textAlign='center';x.fillText('SOLD',cx,base-206);x.restore();}

// pop-in on twos: an element appears at t0 and springs up from its base
function pop(t,t0,draw,{bx,by,from='scale'}={}){const p=spring(t-t0,15,.42);if(p<=0)return;
  x.save();x.translate(bx,by);if(from==='scale')x.scale(p,p);else x.translate(0,(1-p)*900);x.translate(-bx,-by);draw();x.restore();}

window.seek=function(tIn){
  const t=Math.floor(tIn*12)/12;           // animated on twos (12 poses a second)
  BOIL=Math.floor(tIn*12);                 // the edges re-tear every pose
  x.fillStyle=C.paper;x.fillRect(0,0,W,H);x.globalAlpha=.07;x.drawImage(GRAIN,0,0);x.globalAlpha=1;

  // sun and a cloud
  pop(t,1.9,()=>piece(Array.from({length:28},(_,i)=>[820+120*Math.cos(i/28*6.283),640+120*Math.sin(i/28*6.283)]),C.brass,90,{amp:4}),{bx:820,by:1000,from:'slide'});
  pop(t,2.3,()=>{piece([[120,620],[400,620],[380,570],[310,545],[240,560],[170,550]],C.white,95,{amp:5});},{bx:260,by:600});

  // ground: torn hills slide up, back to front
  const hill=(y,c,id,s)=>pop(t,s,()=>piece([[-40,y+40],[260,y-30],[620,y+10],[1120,y-50],[1120,H+40],[-40,H+40]],c,id,{amp:6}),{bx:540,by:H,from:'slide'});
  hill(980,C.mossL,10,0.15);
  hill(1100,C.moss,11,0.35);

  // the street: three houses pop up, one per beat
  pop(t,0.9,()=>house(215,1200,300,290,C.parch,C.slate,C.moss,20,{chimney:true}),{bx:215,by:1200});
  pop(t,1.3,()=>house(545,1210,330,370,C.brassL,C.carbon,C.brick,30),{bx:545,by:1210});
  pop(t,1.7,()=>house(870,1200,290,270,C.white,C.brick,C.slate,40,{chimney:true}),{bx:870,by:1200});
  pop(t,2.1,()=>tree(55,1235,1.0,50),{bx:55,by:1235});
  pop(t,2.5,()=>tree(1040,1235,.85,55),{bx:1040,by:1235});

  // front lawn, sidewalk and road, laid down like strips of paper
  pop(t,0.55,()=>{piece(rect(-40,1190,1160,330),C.mossL,12,{amp:5});
    piece(rect(-40,1500,1160,90),C.white,13,{amp:4});
    piece(rect(-40,1575,1160,400),C.slate,14,{amp:5});
    for(let i=0;i<6;i++)piece(rect(30+i*190,1700,110,22),C.brassL,15+i,{amp:2,shadow:false});},{bx:540,by:H,from:'slide'});
  // a path from each door to the sidewalk
  pop(t,2.7,()=>{for(const[cx,i]of[[215,0],[545,1],[870,2]])piece([[cx-30,1205],[cx+30,1205],[cx+48,1505],[cx-48,1505]],C.paper,22+i,{amp:3});},{bx:540,by:1500});

  // the SOLD sign hops onto the lawn beside the middle path and settles with a wobble
  if(t>=3.1){const dt=t-3.1,w=Math.exp(-3*dt)*Math.sin(dt*14)*.12;
    pop(t,3.1,()=>{x.save();x.translate(700,1470);x.rotate(w);x.translate(-700,-1470);sold(700,1470,60);x.restore();},{bx:700,by:1470});}

  // title strip
  pop(t,4.0,()=>{piece(rect(90,190,900,190),C.white,70,{amp:3});
    x.save();x.font='800 84px MS';x.textAlign='left';const parts=[['Find ',C.ink],['your',C.brassD],[' street.',C.ink]];
    let cx=540-parts.reduce((a,[s])=>a+x.measureText(s).width,0)/2;
    for(const[s,c]of parts){x.fillStyle=c;x.fillText(s,cx,315);cx+=x.measureText(s).width;}x.restore();},{bx:540,by:285});
  pop(t,4.5,()=>{piece(rect(260,1785,560,70),C.carbon,80,{amp:2});
    x.save();x.font='700 30px MR';x.fillStyle=C.parch;x.textAlign='center';x.letterSpacing='3px';x.fillText('THE CAMPBELL-MARIC GROUP',540,1831);x.restore();},{bx:540,by:1785});
};
window.ready=document.fonts.load('800 84px MS').then(()=>document.fonts.load('700 30px MR')).then(()=>window.seek(0));
</script></body></html>
